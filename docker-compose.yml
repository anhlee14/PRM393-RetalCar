services:
  mysql:
    image: mysql:8.0
    container_name: autorental-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autorental_db
    ports:
      - "3306:3306"
    volumes:
      - autorental_mysql_data:/var/lib/mysql

volumes:
  autorental_mysql_data:

