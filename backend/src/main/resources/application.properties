server.port=${PORT:8080}

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autorental_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=150000

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JSON Formatting (Snake Case for Mobile REST compatibility)
spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT Configuration (Secret must be at least 256 bits)
app.jwt.secret=${JWT_SECRET:c2VjdXJlUmVudGFsQXBwSldUU2VjcmV0S2V5MjAyNlBSTTM5M0ZQVFVuaXZlcnNpdHk=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Local File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://10.0.2.2:8080}

